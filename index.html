<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student55 Advanced OMR</title>

<style>

:root{
--theme:#2563eb;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef4ff;
padding:15px;
transition:.3s;
}

.container{
max-width:1400px;
margin:auto;
background:white;
border-radius:20px;
padding:20px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.logo{
font-size:42px;
font-weight:bold;
text-align:center;
color:var(--theme);
margin-bottom:20px;
}

.welcome{
text-align:center;
padding:40px 20px;
}

.welcome h1{
font-size:48px;
color:var(--theme);
margin-bottom:10px;
}

.welcome p{
font-size:20px;
color:#666;
margin-bottom:25px;
}

.card{
background:#f8fafc;
padding:20px;
border-radius:15px;
margin-bottom:15px;
}

.input-group{
margin-bottom:15px;
text-align:left;
}

.input-group label{
display:block;
font-size:18px;
font-weight:bold;
margin-bottom:8px;
}

.input-group input,
.input-group select{
width:100%;
padding:12px;
font-size:18px;
border:1px solid #ccc;
border-radius:10px;
}

.theme-box{
margin-top:20px;
}

.theme-btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
cursor:pointer;
margin:5px;
}

.start-btn{
margin-top:20px;
padding:15px 35px;
font-size:22px;
background:var(--theme);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
}

#customBg{
width:80px;
height:40px;
cursor:pointer;
}

.timer{
display:none;
position:sticky;
top:10px;
z-index:999;
background:white;
padding:10px;
font-size:24px;
font-weight:bold;
text-align:center;
border-radius:10px;
box-shadow:0 0 10px rgba(0,0,0,.1);
margin-bottom:15px;
}

.omr-section{
display:none;
}

.live-panel{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-bottom:15px;
}

.live-box{
background:#f1f5f9;
padding:10px 15px;
border-radius:10px;
font-weight:bold;
}

.remaining{
background:#fff8e1;
padding:12px;
border-radius:10px;
margin-bottom:15px;
}

.header-row{
display:grid;
grid-template-columns:80px repeat(4,1fr) 160px;
padding:12px;
background:#e8edff;
font-size:20px;
font-weight:bold;
border-radius:10px;
}

.question-row{
display:grid;
grid-template-columns:80px repeat(4,1fr) 160px;
padding:12px;
border-bottom:1px solid #ddd;
align-items:center;
font-size:20px;
}

.option{
text-align:center;
}

.option input{
width:28px;
height:28px;
cursor:pointer;
}

@media(max-width:768px){

.logo{
font-size:28px;
}

.welcome h1{
font-size:32px;
}

.header-row,
.question-row{
grid-template-columns:55px repeat(4,1fr) 100px;
font-size:15px;
}

.option input{
width:22px;
height:22px;
}

}

</style>

</head>

<body>

<div class="container">

<div class="logo">
Student55 Advanced OMR
</div>

<div id="welcomePage" class="welcome">

<h1>WELCOME</h1>

<p>
Practice • Test • Improve
</p>

<div class="card">

<div class="input-group">

<label>
Student Name
</label>

<input
type="text"
id="studentName"
placeholder="Enter Your Name">

</div>

<div class="input-group">

<label>
Select Question Count
</label>

<select id="questionCount">

<option value="10">10 Questions</option>
<option value="20">20 Questions</option>
<option value="30">30 Questions</option>
<option value="40">40 Questions</option>
<option value="50">50 Questions</option>
<option value="60">60 Questions</option>
<option value="70">70 Questions</option>
<option value="80">80 Questions</option>
<option value="90">90 Questions</option>
<option value="100">100 Questions</option>

</div>

<div class="theme-box">

<h3>Theme Color</h3>

<button class="theme-btn"
style="background:#2563eb"
onclick="setTheme('#2563eb')"></button>

<button class="theme-btn"
style="background:#16a34a"
onclick="setTheme('#16a34a')"></button>

<button class="theme-btn"
style="background:#9333ea"
onclick="setTheme('#9333ea')"></button>

<button class="theme-btn"
style="background:#dc2626"
onclick="setTheme('#dc2626')"></button>

<button class="theme-btn"
style="background:#111827"
onclick="setTheme('#111827')"></button>

<br><br>

<h3>Custom Background</h3>

<input
type="color"
id="customBg"
oninput="changeBg(this.value)">

</div>

<button
class="start-btn"
onclick="startTest()">
START TEST
</button>

</div>

</div>

<div id="timer" class="timer">
00:00:00
</div>

<div id="omrSection" class="omr-section">

<div class="live-panel">

<div class="live-box">
Attempted:
<span id="attemptedLive">0</span>
</div>

<div class="live-box">
Remaining:
<span id="remainingLive">0</span>
</div>

</div>

<div
id="remainingQuestions"
class="remaining">

Remaining Questions:

</div>

<div class="header-row">

<div>Q</div>
<div>A</div>
<div>B</div>
<div>C</div>
<div>D</div>
<div>Check</div>

</div>

<div id="questions"></div>

<script>

let submitted=false;
let totalQuestions=0;
let seconds=0;
let timerInterval;

function setTheme(color){

document.documentElement
.style.setProperty(
'--theme',
color
);

}

function changeBg(color){

document.body.style.background=
color;

}

</script>

<script>

let studentName = "";
let selectedAnswers = {};

/* START TEST */

function startTest(){

studentName =
document.getElementById(
"studentName"
).value.trim();

if(studentName===""){

alert(
"Please Enter Your Name"
);

return;

}

totalQuestions =
parseInt(
document.getElementById(
"questionCount"
).value
);

selectedAnswers = {};

document.getElementById(
"welcomePage"
).style.display =
"none";

document.getElementById(
"omrSection"
).style.display =
"block";

document.getElementById(
"timer"
).style.display =
"block";

document.getElementById(
"attemptedLive"
).innerText =
"0";

document.getElementById(
"remainingLive"
).innerText =
totalQuestions;

generateQuestions();

updateLiveTracker();

startTimer();

}

/* TIMER */

function startTimer(){

timerInterval =
setInterval(()=>{

seconds++;

let hrs =
String(
Math.floor(seconds/3600)
).padStart(2,"0");

let mins =
String(
Math.floor(
(seconds%3600)/60
)
).padStart(2,"0");

let secs =
String(
seconds%60
).padStart(2,"0");

document.getElementById(
"timer"
).innerText =
hrs + ":" + mins + ":" + secs;

},1000);

}

/* GENERATE QUESTIONS */

function generateQuestions(){

let box =
document.getElementById(
"questions"
);

box.innerHTML = "";

for(
let i=1;
i<=totalQuestions;
i++
){

let qno =
String(i)
.padStart(3,"0");

let row =
document.createElement(
"div"
);

row.className =
"question-row";

row.innerHTML = `

<div>${qno}</div>

<div class="option">
<input type="radio"
name="q${i}"
value="A"
onchange="saveAnswer(${i},'A')">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="B"
onchange="saveAnswer(${i},'B')">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="C"
onchange="saveAnswer(${i},'C')">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="D"
onchange="saveAnswer(${i},'D')">
</div>

<div>

<button
id="right${i}"
style="
display:none;
background:#16a34a;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
">
✔
</button>

<button
id="wrong${i}"
style="
display:none;
background:#dc2626;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
">
✖
</button>

<span id="status${i}"></span>

</div>

`;

box.appendChild(
row
);

}

}

/* SAVE ANSWER */

function saveAnswer(
q,
ans
){

selectedAnswers[q] =
ans;

updateLiveTracker();

}

/* LIVE TRACKER */

function updateLiveTracker(){

let attempted =
Object.keys(
selectedAnswers
).length;

let remaining =
[];

for(
let i=1;
i<=totalQuestions;
i++
){

if(
!selectedAnswers[i]
){

remaining.push(i);

}

}

document.getElementById(
"attemptedLive"
).innerText =
attempted;

document.getElementById(
"remainingLive"
).innerText =
totalQuestions-attempted;

document.getElementById(
"remainingQuestions"
).innerHTML =

"<b>Remaining Questions:</b><br>" +

(
remaining.length
?
remaining.join(", ")
:
"All Questions Attempted ✅"
);

}

</script>


<script>

let rightCount = 0;
let wrongCount = 0;

/* SUBMIT BUTTON */

let submitBox =
document.createElement(
"div"
);

submitBox.style.textAlign =
"center";

submitBox.style.marginTop =
"20px";

submitBox.innerHTML =

`

<button
id="submitBtn"
onclick="submitTest()"
style="
padding:15px 35px;
font-size:22px;
background:var(--theme);
color:white;
border:none;
border-radius:12px;
cursor:pointer;
">

SUBMIT TEST

</button>

`;

document
.getElementById(
"omrSection"
)
.appendChild(
submitBox
);

/* SUBMIT TEST */

function submitTest(){

if(submitted){
return;
}

submitted = true;

clearInterval(
timerInterval
);

for(
let i=1;
i<=totalQuestions;
i++
){

document
.querySelectorAll(
`input[name="q${i}"]`
)
.forEach(input=>{

input.disabled=true;

});

if(
selectedAnswers[i]
){

document.getElementById(
`right${i}`
).style.display =
"inline-block";

document.getElementById(
`wrong${i}`
).style.display =
"inline-block";

}

}

showResultBox();

alert(
"Test Submitted Successfully"
);

}

/* RIGHT MARK */

function markRight(q){

let status =
document.getElementById(
`status${q}`
);

status.innerHTML =
" ✔ Correct";

status.style.color =
"#16a34a";

document.getElementById(
`right${q}`
).disabled=true;

document.getElementById(
`wrong${q}`
).disabled=true;

rightCount++;

updateResult();

}

/* WRONG MARK */

function markWrong(q){

let status =
document.getElementById(
`status${q}`
);

status.innerHTML =
" ✖ Wrong";

status.style.color =
"#dc2626";

document.getElementById(
`right${q}`
).disabled=true;

document.getElementById(
`wrong${q}`
).disabled=true;

wrongCount++;

updateResult();

}

/* ATTACH BUTTON EVENTS */

function attachCheckEvents(){

for(
let i=1;
i<=totalQuestions;
i++
){

let r =
document.getElementById(
`right${i}`
);

let w =
document.getElementById(
`wrong${i}`
);

if(r){

r.onclick=()=>{

markRight(i);

};

}

if(w){

w.onclick=()=>{

markWrong(i);

};

}

}

}

setTimeout(
attachCheckEvents,
1000
);

/* RESULT BOX */

function showResultBox(){

if(
document.getElementById(
"resultBox"
)
){
return;
}

let div =
document.createElement(
"div"
);

div.id =
"resultBox";

div.className =
"card";

div.innerHTML =

`

<h2>
Result Summary
</h2>

<p>
Name :
<b id="resName">
${studentName}
</b>
</p>

<p>
Attempted :
<span id="attemptedResult">
0
</span>
</p>

<p>
Right :
<span id="rightResult">
0
</span>
</p>

<p>
Wrong :
<span id="wrongResult">
0
</span>
</p>

<p>
Unattempted :
<span id="unattemptedResult">
0
</span>
</p>

<p>
Percentage :
<span id="percentageResult">
0%
</span>
</p>

<p>
Grade :
<span id="gradeResult">
-
</span>
</p>

<p>
Status :
<span id="statusResult">
-
</span>
</p>

`;

document
.getElementById(
"omrSection"
)
.appendChild(
div
);

updateResult();

}

/* UPDATE RESULT */

function updateResult(){

let attempted =
rightCount + wrongCount;

let unattempted =
totalQuestions - attempted;

let percentage = 0;

if(attempted>0){

percentage =
(
rightCount /
attempted
)*100;

}

let grade="D";
let result="FAIL";

if(
percentage>=90
){

grade="A+";
result="PASS";

}
else if(
percentage>=75
){

grade="A";
result="PASS";

}
else if(
percentage>=60
){

grade="B";
result="PASS";

}
else if(
percentage>=40
){

grade="C";
result="PASS";

}

document.getElementById(
"attemptedResult"
).innerText =
attempted;

document.getElementById(
"rightResult"
).innerText =
rightCount;

document.getElementById(
"wrongResult"
).innerText =
wrongCount;

document.getElementById(
"unattemptedResult"
).innerText =
unattempted;

document.getElementById(
"percentageResult"
).innerText =
percentage.toFixed(2)+"%";

document.getElementById(
"gradeResult"
).innerText =
grade;

document.getElementById(
"statusResult"
).innerText =
result;

}

</script>

/* UNCHECKED PDF */

async function downloadUncheckedPDF(){

const { jsPDF } =
window.jspdf;

const doc =
new jsPDF();

let y = 20;

doc.setFontSize(18);

doc.text(
"STUDENT55 OMR SHEET",
20,
y
);

doc.setFontSize(11);

20,

);

doc.text(
"Time : " +
document.getElementById(
"timer"
).innerText,
20,
y
);

y += 12;

for(
let i=1;
i<=totalQuestions;
i++
){

let ans =
selectedAnswers[i]
?
selectedAnswers[i]
:
"-";

doc.text(
"Q"+
String(i)
.padStart(3,"0")
+
"   A  B  C  D"
+
"   Selected : "
+
ans,
20,
y
);

y += 8;

if(y>270){

doc.addPage();

y=20;

}

}

doc.setFontSize(28);

doc.setTextColor(
220,
220,
220
);

doc.text(
"student55.netlify.app",
25,
180,
{
angle:45
}
);

doc.save(
studentName +
"_OMR.pdf"
);

}

);

);

);

y+=8;

doc.text(

);

y+=8;

"Time : " +
document.getElementById(

).innerText,

);

y+=12;

for(

){

let ans =

?

:

<script>

<div id="starContainer">

<script>

/* DARK MODE */

let darkMode = false;

let darkBtn =
document.createElement(
"button"
);

darkBtn.innerHTML =
"🌙 Dark Mode";

darkBtn.style.position =
"fixed";

darkBtn.style.right =
"20px";

darkBtn.style.bottom =
"20px";

darkBtn.style.padding =
"12px 18px";

darkBtn.style.border =
"none";

darkBtn.style.borderRadius =
"10px";

darkBtn.style.cursor =
"pointer";

darkBtn.style.zIndex =
"9999";

document.body.appendChild(
darkBtn
);

darkBtn.onclick = ()=>{

darkMode = !darkMode;

if(darkMode){

document.body.style.background =
"#111827";

document.body.style.color =
"white";

document.querySelector(
".container"
).style.background =
"#1f2937";

darkBtn.innerHTML =
"☀ Light Mode";

}else{

document.body.style.background =
"#eef4ff";

document.body.style.color =
"black";

document.querySelector(
".container"
).style.background =
"white";

darkBtn.innerHTML =
"🌙 Dark Mode";

}

};

/* SCROLL TO TOP */

let topBtn =
document.createElement(
"button"
);

topBtn.innerHTML =
"⬆ Top";

topBtn.style.position =
"fixed";

topBtn.style.left =
"20px";

topBtn.style.bottom =
"20px";

topBtn.style.padding =
"12px 18px";

topBtn.style.border =
"none";

topBtn.style.borderRadius =
"10px";

topBtn.style.cursor =
"pointer";

topBtn.style.display =
"none";

topBtn.style.zIndex =
"9999";

document.body.appendChild(
topBtn
);

window.onscroll = ()=>{

if(
document.documentElement.scrollTop > 300
){

topBtn.style.display =
"block";

}else{

topBtn.style.display =
"none";

}

};

topBtn.onclick = ()=>{

window.scrollTo({

top:0,
behavior:"smooth"

});

};

/* FOOTER */

let footer =
document.createElement(
"div"
);

footer.style.marginTop =
"40px";

footer.style.textAlign =
"center";

footer.style.padding =
"25px";

<style>

/* SELECTED OPTION HIGHLIGHT */

.option input:checked{

transform:scale(1.3);

accent-color:var(--theme);

}

/* DESKTOP FONT BOOST */

@media(min-width:1000px){

.question-row{

font-size:24px;

}

.header-row{

font-size:24px;

}

.option input{

width:32px;
height:32px;

}

}

/* MOBILE IMPROVEMENTS */

@media(max-width:768px){

.question-row{

font-size:14px;

}

.header-row{

font-size:14px;

}

.live-box{

font-size:14px;

}

}

/* QUESTION NAVIGATOR */

#questionNavigator{

display:flex;

flex-wrap:wrap;

gap:8px;

margin-top:15px;

margin-bottom:15px;

}

.navBtn{

width:45px;

height:45px;

border:none;

border-radius:50%;

cursor:pointer;

font-weight:bold;

background:#e5e7eb;

}

.navAnswered{

background:#16a34a !important;

color:white;

}

.navPending{

background:#dc2626 !important;

color:white;

}

</style>

<script>

/* QUESTION NAVIGATOR */

let navigatorBox =
document.createElement(
"div"
);

navigatorBox.id =
"questionNavigator";

document
.getElementById(
"omrSection"
)
.insertBefore(
navigatorBox,
document.getElementById(
"questions"
)
);

/* BUILD NAVIGATOR */

function buildNavigator(){

navigatorBox.innerHTML="";

for(
let i=1;
i<=totalQuestions;
i++
){

let btn =
document.createElement(
"button"
);

btn.className =
"navBtn navPending";

btn.innerText =
i;

btn.onclick = ()=>{

document
.querySelector(
`input[name="q${i}"]`
)
.scrollIntoView({

behavior:"smooth",
block:"center"

});

};

navigatorBox.appendChild(
btn
);

}

}

/* UPDATE NAVIGATOR */

function updateNavigator(){

let buttons =
document.querySelectorAll(
".navBtn"
);

buttons.forEach(
(btn,index)=>{

let q =
index+1;

if(
selectedAnswers[q]
){

btn.className =
"navBtn navAnswered";

}else{

btn.className =
"navBtn navPending";

}

});

}

/* EXISTING FUNCTION KO EXTEND KARO */

const oldUpdateTracker =
updateLiveTracker;

updateLiveTracker = function(){

oldUpdateTracker();

updateNavigator();

};

/* START TEST KE BAAD */

const oldStartTest =
startTest;

startTest = function(){

oldStartTest();

buildNavigator();

};

</script>
