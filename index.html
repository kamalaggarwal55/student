<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Student55 OMR Test</title>

<style>

:root{
--theme:#2563eb;
}

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:Arial,sans-serif;
}

body{
background:#eef4ff;
padding:15px;
transition:.3s;
}

.container{
max-width:1400px;
margin:auto;
background:white;
padding:20px;
border-radius:20px;
box-shadow:0 0 15px rgba(0,0,0,.1);
}

.logo{
font-size:40px;
font-weight:bold;
text-align:center;
color:var(--theme);
margin-bottom:20px;
}

.start-screen{
text-align:center;
padding:40px 20px;
}

.start-btn{
background:var(--theme);
color:white;
border:none;
padding:15px 35px;
font-size:22px;
border-radius:12px;
cursor:pointer;
}

.theme-box{
margin-top:25px;
}

.theme-btn{
width:40px;
height:40px;
border:none;
border-radius:50%;
cursor:pointer;
margin:5px;
}

#customColor{
width:80px;
height:40px;
cursor:pointer;
margin-top:10px;
}

.timer{
display:none;
position:sticky;
top:10px;
z-index:999;
background:white;
padding:10px;
border-radius:10px;
font-size:24px;
font-weight:bold;
text-align:center;
margin-bottom:15px;
box-shadow:0 0 10px rgba(0,0,0,.1);
}

.omr-section{
display:none;
}

.header-row{
display:grid;
grid-template-columns:80px repeat(4,1fr) 140px;
background:#e8edff;
padding:12px;
border-radius:10px;
font-size:20px;
font-weight:bold;
}

.question-row{
display:grid;
grid-template-columns:80px repeat(4,1fr) 140px;
padding:12px;
border-bottom:1px solid #ddd;
align-items:center;
font-size:20px;
}

.qno{
font-weight:bold;
}

.option{
text-align:center;
}

.option input{
width:28px;
height:28px;
cursor:pointer;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
margin-top:20px;
}

.btn{
background:var(--theme);
color:white;
border:none;
padding:12px 18px;
border-radius:10px;
cursor:pointer;
}

.summary{
display:none;
margin-top:20px;
padding:15px;
background:#f7f7f7;
border-radius:12px;
}

.card{
margin-top:20px;
padding:15px;
background:#fafafa;
border-radius:12px;
}

.star{
font-size:35px;
cursor:pointer;
}

textarea,
input[type=text]{
width:100%;
padding:10px;
margin-top:10px;
border:1px solid #ccc;
border-radius:8px;
}

.watermark{
position:fixed;
bottom:10px;
left:10px;
opacity:.15;
font-size:18px;
font-weight:bold;
pointer-events:none;
}

@media(max-width:768px){

.logo{
font-size:28px;
}

.header-row,
.question-row{
font-size:15px;
grid-template-columns:55px repeat(4,1fr) 100px;
}

.option input{
width:22px;
height:22px;
}

}

</style>
</head>

<body>

<div class="watermark">
student55.netlify.app
</div>

<div class="container">

<div class="logo">
Student55 OMR Test
</div>

<div id="startScreen" class="start-screen">

<h1>Welcome</h1>

<p style="margin-top:10px">
100 Question OMR Practice Test
</p>

<div class="theme-box">

<h3>Select Theme</h3>

<button class="theme-btn"
style="background:#2563eb"
onclick="setTheme('#2563eb')"></button>

<button class="theme-btn"
style="background:#16a34a"
onclick="setTheme('#16a34a')"></button>

<button class="theme-btn"
style="background:#9333ea"
onclick="setTheme('#9333ea')"></button>

<button class="theme-btn"
style="background:#dc2626"
onclick="setTheme('#dc2626')"></button>

<button class="theme-btn"
style="background:#111827"
onclick="setTheme('#111827')"></button>

<br><br>

<h3>Custom Background</h3>

<input
type="color"
id="customColor"
oninput="changeBg(this.value)">

</div>

<br>

<button
class="start-btn"
onclick="startTest()">
START TEST
</button>

</div>

<div id="timer" class="timer">
00:00:00
</div>

<div id="omrSection" class="omr-section">

<div class="header-row">
<div>Q</div>
<div>A</div>
<div>B</div>
<div>C</div>
<div>D</div>
<div>Check</div>
</div>

<div id="questions"></div>

<div class="controls">

<button class="btn"
onclick="submitOMR()">
Submit
</button>

<button class="btn"
onclick="restartOMR()">
Restart
</button>

<button class="btn"
onclick="downloadResult()">
Download
</button>

</div>

<div id="summary" class="summary">

<h2>Result Summary</h2>

<p>Attempted :
<span id="attempted">0</span></p>

<p>Right :
<span id="rightCount">0</span></p>

<p>Wrong :
<span id="wrongCount">0</span></p>

<p>Unattempted :
<span id="unattempted">100</span></p>

</div>

<script>

let submitted=false;
let attempted=0;
let rightCount=0;
let wrongCount=0;
let selectedRating=0;

let seconds=0;
let timerInterval;

function setTheme(color){

document.documentElement
.style.setProperty(
'--theme',
color
);

}

function changeBg(color){

document.body.style.background=
color;

}

function startTest(){

document.getElementById(
"startScreen"
).style.display="none";

document.getElementById(
"omrSection"
).style.display="block";

document.getElementById(
"timer"
).style.display="block";

timerInterval=
setInterval(()=>{

seconds++;

let h=
String(
Math.floor(seconds/3600)
).padStart(2,"0");

let m=
String(
Math.floor(
(seconds%3600)/60
)
).padStart(2,"0");

let s=
String(
seconds%60
).padStart(2,"0");

document.getElementById(
"timer"
).innerHTML=
`${h}:${m}:${s}`;

},1000);

}

</script>

<script>

/* 100 QUESTIONS GENERATE */

const questionsDiv =
document.getElementById(
"questions"
);

for(let i=1;i<=100;i++){

let num=
String(i)
.padStart(3,"0");

let row=
document.createElement(
"div"
);

row.className=
"question-row";

row.innerHTML=`

<div class="qno">
${num}
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="A">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="B">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="C">
</div>

<div class="option">
<input type="radio"
name="q${i}"
value="D">
</div>

<div>

<button
id="right${i}"
style="
display:none;
background:#16a34a;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
margin-right:4px;
"
onclick="markRight(${i})">
✔
</button>

<button
id="wrong${i}"
style="
display:none;
background:#dc2626;
color:white;
border:none;
padding:6px 10px;
border-radius:6px;
cursor:pointer;
"
onclick="markWrong(${i})">
✖
</button>

<span
id="status${i}"
style="
font-weight:bold;
margin-left:5px;
">
</span>

</div>

`;

questionsDiv.appendChild(
row
);

}

/* SUBMIT */

function submitOMR(){

if(submitted){
return;
}

submitted=true;

clearInterval(
timerInterval
);

attempted=0;

for(
let i=1;
i<=100;
i++
){

let selected=
document.querySelector(
`input[name="q${i}"]:checked`
);

if(selected){

attempted++;

document
.getElementById(
`right${i}`
)
.style.display=
"inline-block";

document
.getElementById(
`wrong${i}`
)
.style.display=
"inline-block";

}

document
.querySelectorAll(
`input[name="q${i}"]`
)
.forEach(el=>{

el.disabled=true;

});

}

document
.getElementById(
"summary"
)
.style.display=
"block";

document
.getElementById(
"attempted"
)
.innerText=
attempted;

document
.getElementById(
"unattempted"
)
.innerText=
100-attempted;

alert(
"Test Submitted"
);

}

/* RIGHT */

function markRight(q){

let status=
document.getElementById(
`status${q}`
);

status.innerHTML=
"✔";

status.style.color=
"#16a34a";

document
.getElementById(
`right${q}`
)
.disabled=true;

document
.getElementById(
`wrong${q}`
)
.disabled=true;

rightCount++;

document
.getElementById(
"rightCount"
)
.innerText=
rightCount;

}

/* WRONG */

function markWrong(q){

let status=
document.getElementById(
`status${q}`
);

status.innerHTML=
"✖";

status.style.color=
"#dc2626";

document
.getElementById(
`right${q}`
)
.disabled=true;

document
.getElementById(
`wrong${q}`
)
.disabled=true;

wrongCount++;

document
.getElementById(
"wrongCount"
)
.innerText=
wrongCount;

}

</script>

<script>

/* RESTART */

function restartOMR(){

let ok =
confirm(
"Restart Test?"
);

if(!ok){
return;
}

location.reload();

}

/* RESULT CARD */

function updateFinalResult(){

let total =
rightCount + wrongCount;

if(total===0){
return;
}

let percentage =
(
(rightCount/total)
*100
).toFixed(2);

let grade="D";
let result="FAIL";

if(percentage>=90){
grade="A+";
result="PASS";
}
else if(percentage>=75){
grade="A";
result="PASS";
}
else if(percentage>=60){
grade="B";
result="PASS";
}
else if(percentage>=40){
grade="C";
result="PASS";
}

let old =
document.getElementById(
"finalCard"
);

if(old){
old.remove();
}

let card =
document.createElement(
"div"
);

card.id="finalCard";

card.className=
"card";

card.innerHTML=`

<h2>Final Result</h2>

<p>
Percentage :
<b>${percentage}%</b>
</p>

<p>
Grade :
<b>${grade}</b>
</p>

<p>
Status :
<b>${result}</b>
</p>

`;

document
.getElementById(
"summary"
)
.appendChild(card);

}

/* UPDATE AFTER RIGHT */

const oldMarkRight =
markRight;

markRight = function(q){

oldMarkRight(q);

updateFinalResult();

}

/* UPDATE AFTER WRONG */

const oldMarkWrong =
markWrong;

markWrong = function(q){

oldMarkWrong(q);

updateFinalResult();

}

/* DOWNLOAD RESULT */

function downloadResult(){

if(!submitted){

alert(
"Submit Test First"
);

return;
}

let report="";

report +=
"STUDENT55 OMR REPORT\n\n";

report +=
"Website : student55.netlify.app\n\n";

report +=
"Time : "
+
document
.getElementById(
"timer"
)
.innerText
+
"\n\n";

report +=
"Attempted : "
+
attempted
+
"\n";

report +=
"Right : "
+
rightCount
+
"\n";

report +=
"Wrong : "
+
wrongCount
+
"\n";

report +=
"Unattempted : "
+
(100-attempted)
+
"\n\n";

for(
let i=1;
i<=100;
i++
){

let selected =
document.querySelector(
`input[name="q${i}"]:checked`
);

let ans =
selected
?
selected.value
:
"NA";

report +=
"Q"
+
String(i)
.padStart(3,"0")
+
" : "
+
ans
+
"\n";

}

report +=
"\nstudent55.netlify.app";

let blob =
new Blob(
[report],
{
type:"text/plain"
}
);

let link =
document.createElement(
"a"
);

link.href =
URL.createObjectURL(
blob
);

link.download =
"Student55_Result.txt";

link.click();

}

/* SCROLL TO TOP */

let topBtn =
document.createElement(
"button"
);

topBtn.innerHTML =
"⬆";

topBtn.style.position =
"fixed";

topBtn.style.right =
"20px";

topBtn.style.bottom =
"20px";

topBtn.style.padding =
"12px";

topBtn.style.border =
"none";

topBtn.style.borderRadius =
"50%";

topBtn.style.cursor =
"pointer";

topBtn.style.display =
"none";

document.body.appendChild(
topBtn
);

window.addEventListener(
"scroll",
()=>{

if(
window.scrollY>300
){
topBtn.style.display=
"block";
}else{
topBtn.style.display=
"none";
}

}
);

topBtn.onclick=()=>{

window.scrollTo({
top:0,
behavior:"smooth"
});

}

</script>

<script>

/* STAR RATING */

let ratingBox =
document.createElement(
"div"
);

ratingBox.className =
"card";

ratingBox.innerHTML = `

<h2>Rate This Site</h2>

<div id="stars">

<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>
<span class="star">☆</span>

</div>

<p id="ratingText">
No Rating Selected
</p>

`;

document
.querySelector(
".container"
)
.appendChild(
ratingBox
);

let stars =
document.querySelectorAll(
".star"
);

stars.forEach(
(star,index)=>{

star.addEventListener(
"click",
()=>{

selectedRating=
index+1;

stars.forEach(
(s,i)=>{

if(i<=index){

s.innerHTML="⭐";

}else{

s.innerHTML="☆";

}

});

document
.getElementById(
"ratingText"
)
.innerHTML=
"Selected Rating : "
+
selectedRating
+
"/5";

});

});

/* REVIEW */

let reviewCard =
document.createElement(
"div"
);

reviewCard.className=
"card";

reviewCard.innerHTML=`

<h2>Review</h2>

<textarea
id="review"
rows="5"
placeholder="Write your review">
</textarea>

`;

document
.querySelector(
".container"
)
.appendChild(
reviewCard
);

/* CONTACT */

let contactCard =
document.createElement(
"div"
);

contactCard.className=
"card";

contactCard.innerHTML=`

<h2>Contact & Help</h2>

<input
type="text"
placeholder="Your Name">

<textarea
rows="5"
placeholder="Write your message">
</textarea>

`;

document
.querySelector(
".container"
)
.appendChild(
contactCard
);

/* DARK MODE */

let darkBtn =
document.createElement(
"button"
);

darkBtn.className=
"btn";

darkBtn.innerHTML=
"🌙 Dark Mode";

document
.querySelector(
".controls"
)
.appendChild(
darkBtn
);

let dark=false;

darkBtn.onclick=()=>{

dark=!dark;

if(dark){

document.body.style.background=
"#111827";

document.body.style.color=
"white";

document
.querySelector(
".container"
)
.style.background=
"#1f2937";

}else{

document.body.style.background=
"#eef4ff";

document.body.style.color=
"black";

document
.querySelector(
".container"
)
.style.background=
"white";

}

};

/* INSTAGRAM */

let instaCard =
document.createElement(
"div"
);

instaCard.className=
"card";

instaCard.innerHTML=`

<h2>Instagram</h2>

<a
href="#"
id="instaLink">
Visit Instagram
</a>

`;

document
.querySelector(
".container"
)
.appendChild(
instaCard
);

/* FOOTER */

let footer =
document.createElement(
"div"
);

footer.style.marginTop=
"30px";

footer.style.padding=
"20px";

footer.style.textAlign=
"center";

footer.innerHTML=`

<hr><br>

<h3>
Student55 OMR
</h3>

<p>
Practice • Learn • Improve
</p>

<br>

<p>
student55.netlify.app
</p>

<br>

<p>
© Student55
</p>

`;

document
.querySelector(
".container"
)
.appendChild(
footer
);

</script>
