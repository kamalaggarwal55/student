<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student55 Super Fast OMR V5</title>

<!-- External Libraries & Fonts -->
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdnjs.cloudflare.com/ajax/libs/tesseract.js/4.1.1/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/jspdf/2.5.1/jspdf.umd.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
:root { --theme: #2563eb; --bg: #f5f7fb; --card: #ffffff; --text: #111827; --border: #d1d5db; }
body { background: var(--bg); color: var(--text); transition: 0.3s; }
.dark { --bg: #111827; --card: #1f2937; --text: #ffffff; --border: #374151; }
.container { width: 95%; max-width: 1600px; margin: auto; padding: 20px; }

/* WELCOME PAGE */
#welcomePage {
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
    display: flex; justify-content: center; align-items: center; padding: 20px;
}
.welcome-box {
    max-width: 1000px; width: 100%;
    background: rgba(255, 255, 255, 0.12); backdrop-filter: blur(15px);
    padding: 40px; border-radius: 30px; text-align: center; color: white;
}
.welcome-box h1 { font-size: clamp(28px, 6vw, 48px); margin-bottom: 15px; }
.start-btn {
    margin-top: 25px; padding: 15px 40px; font-size: 18px; font-weight: 700;
    border: none; border-radius: 50px; cursor: pointer; background: white; color: #2563eb;
    transition: 0.2s;
}
.start-btn:hover { transform: scale(1.05); }

/* CROP MODAL */
#cropContainer { display: none; margin-top: 15px; background: #000; padding: 10px; border-radius: 15px; }
#cropImage { max-width: 100%; max-height: 400px; }

/* APP MAIN */
#app { display: none; }
.header { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
.header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 26px; font-weight: 700; color: var(--theme); }
.btn { background: var(--theme); color: white; padding: 10px 18px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
.timer { background: #111827; color: white; padding: 10px 15px; border-radius: 10px; font-weight: 700; }

/* RESULTS & NAVIGATOR */
.result-panel { display: none; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(130px, 1fr)); gap: 15px; }
.result-box { background: #eef2ff; color: #111827; padding: 15px; border-radius: 15px; text-align: center; }

.navigator { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.nav-btn { width: 42px; height: 42px; border: none; border-radius: 50%; background: #e5e7eb; color: #111827; font-size: 16px; font-weight: 700; cursor: pointer; }
.nav-btn.done { background: var(--theme); color: #fff; }
.nav-btn.checked-right { background: #16a34a !important; color: white !important; }
.nav-btn.checked-wrong { background: #dc2626 !important; color: white !important; }

/* OMR SHEET TABLE */
.omr-sheet { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); overflow-x: auto; }
.omr-header, .omr-row { display: grid; grid-template-columns: 80px repeat(4, 65px) 100px 100px 100px 100px; align-items: center; padding: 10px; min-width: 800px; }
.omr-header { font-weight: 700; border-bottom: 2px solid var(--border); margin-bottom: 10px; }
.omr-row { border-bottom: 1px solid var(--border); }
.qno { font-weight: 600; }
.option { width: 45px; height: 45px; border: 2.5px solid #b8bec8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; cursor: pointer; margin: auto; transition: 0.15s; }
.option.selected { background: var(--theme); color: white; border-color: var(--theme); }
.correct-row { background: rgba(22, 163, 74, 0.15) !important; }
.wrong-row { background: rgba(220, 38, 38, 0.15) !important; }

.check-btn { display: none; padding: 6px 10px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: 600; }
.right-btn { background: #16a34a; }
.wrong-btn { background: #dc2626; }

/* SPINNER OVERLAY */
#loadingOverlay { display: none; position: fixed; top:0; left:0; right:0; bottom:0; background: rgba(0,0,0,0.85); z-index: 9999; color: white; flex-direction: column; align-items: center; justify-content: center; }
.spinner { width: 50px; height: 50px; border: 5px solid #fff; border-top: 5px solid #2563eb; border-radius: 50%; animation: spin 0.8s linear infinite; margin-bottom: 15px; }
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <h3 id="loadingText">Super Fast Processing...</h3>
</div>

<!-- WELCOME PAGE -->
<section id="welcomePage">
    <div class="welcome-box">
        <h1>🎯 Student55 Fast OMR V5</h1>
        <p>Ultra Fast Answer Key Reader with Image Cropper</p>

        <div style="margin-top:20px; padding:20px; background:rgba(255,255,255,.15); border-radius:15px; text-align:left;">
            <h3 style="margin-bottom:10px; color:white;">📸 Upload Answer Key Image</h3>
            <input type="file" id="answerKeyImage" accept="image/*" style="width:100%; padding:10px; border-radius:10px; background:white; color:#111827;">
            
            <div id="cropContainer">
                <img id="cropImage" src="">
                <button class="btn" style="margin-top:10px; background:#16a34a;" onclick="cropAndRead()">⚡ Crop & Read Image Now</button>
            </div>
        </div>

        <button class="start-btn" id="startBtn" onclick="startApp()">Start Test Directly</button>
    </div>
</section>

<!-- MAIN APP -->
<div id="app">
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="logo">Student55 Fast OMR V5</div>
                <div style="display:flex; gap:10px;">
                    <button class="btn" onclick="location.reload()">🏠 Home</button>
                    <button class="btn" onclick="document.body.classList.toggle('dark')">🌙 Dark Mode</button>
                    <div class="timer" id="timer">00:00</div>
                </div>
            </div>
        </div>

        <div id="resultPanel" class="result-panel">
            <h2>📊 Live Result</h2>
            <div class="result-grid" style="margin-top:10px;">
                <div class="result-box"><h3>Total</h3><h1 id="totalQuestions">0</h1></div>
                <div class="result-box"><h3>Attempted</h3><h1 id="attemptedQuestions">0</h1></div>
                <div class="result-box"><h3>Right</h3><h1 id="rightQuestions">0</h1></div>
                <div class="result-box"><h3>Wrong</h3><h1 id="wrongQuestions">0</h1></div>
                <div class="result-box"><h3>Accuracy</h3><h1 id="accuracyPercent">0%</h1></div>
            </div>
        </div>

        <div id="navigator" class="navigator"></div>

        <div class="omr-sheet" id="omrExportSheet">
            <div style="text-align:center; margin-bottom:15px;">
                <button class="btn" id="startTimerBtn" onclick="startTestTimer()">▶ Start Test Timer</button>
            </div>

            <div class="omr-header">
                <div>Q.No</div>
                <div style="text-align:center;">Ⓐ</div>
                <div style="text-align:center;">Ⓑ</div>
                <div style="text-align:center;">Ⓒ</div>
                <div style="text-align:center;">Ⓓ</div>
                <div style="text-align:center;">Right</div>
                <div style="text-align:center;">Wrong</div>
                <div style="text-align:center;">Your Ans</div>
                <div style="text-align:center;">Correct Ans</div>
            </div>

            <div id="omrContainer"></div>
        </div>

        <div style="text-align:center; margin-top:20px;">
            <button id="submitBtn" class="btn" onclick="submitTest()" style="padding:15px 40px; font-size:18px;">Submit Test</button>
        </div>

        <div id="pdfArea" style="display:none; text-align:center; margin-top:20px;">
            <button class="btn" onclick="downloadOMRPDF()">📄 Download Report PDF</button>
        </div>
    </div>
</div>

<script>
let cropper = null;
let totalQuestions = 14;
let answers = {};
let answerKey = {};
let autoCheckMode = false;
let testStarted = false;
let submitted = false;
let rightCount = 0, wrongCount = 0, seconds = 0, timerInterval = null;
let checkedQuestions = {};

// Handle Image Select
document.getElementById('answerKeyImage').addEventListener('change', function(e) {
    const file = e.target.files[0];
    if (file) {
        const reader = new FileReader();
        reader.onload = function(event) {
            const cropImg = document.getElementById('cropImage');
            cropImg.src = event.target.result;
            document.getElementById('cropContainer').style.display = 'block';
            
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImg, { aspectRatio: NaN, viewMode: 1 });
        };
        reader.readAsDataURL(file);
    }
});

async function cropAndRead() {
    if (!cropper) return;
    
    document.getElementById('loadingOverlay').style.display = 'flex';
    document.getElementById('loadingText').innerText = "Reading Image Text Rapidly...";

    const canvas = cropper.getCroppedCanvas();
    
    // Fast OCR Config
    const worker = await Tesseract.createWorker('eng', 1, {
        logger: m => console.log(m)
    });
    
    await worker.setParameters({
        tessedit_char_whitelist: '0123456789ABCD.- \n',
        tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
    });

    const { data: { text } } = await worker.recognize(canvas);
    await worker.terminate();

    answerKey = {};
    const lines = text.split('\n');

    lines.forEach(line => {
        // High accuracy match for format like 1.B, 2.A, 14.C etc.
        const match = line.match(/(\d+)\s*[\.\-:]*\s*([A-D])/i);
        if (match) {
            answerKey[parseInt(match[1])] = match[2].toUpperCase();
        }
    });

    document.getElementById('loadingOverlay').style.display = 'none';

    const detectedKeys = Object.keys(answerKey);
    if (detectedKeys.length > 0) {
        autoCheckMode = true;
        totalQuestions = detectedKeys.length;
        alert(`Success! Read ${totalQuestions} Questions accurately.`);
        startApp();
    } else {
        alert("Text not clearly readable. Try cropping tightly around numbers.");
    }
}

function startApp() {
    document.getElementById("welcomePage").style.display = "none";
    document.getElementById("app").style.display = "block";
    generateOMR();
    document.getElementById("resultPanel").style.display = "block";
    updateResult();
}

function generateOMR() {
    const omr = document.getElementById("omrContainer");
    const nav = document.getElementById("navigator");
    omr.innerHTML = ""; nav.innerHTML = "";

    for (let i = 1; i <= totalQuestions; i++) {
        const row = document.createElement("div");
        row.className = "omr-row";
        row.id = "row-" + i;
        row.innerHTML = `
            <div class="qno">${String(i).padStart(2, "0")}</div>
            <div class="option" onclick="selectOption(${i},'A',this)">Ⓐ</div>
            <div class="option" onclick="selectOption(${i},'B',this)">Ⓑ</div>
            <div class="option" onclick="selectOption(${i},'C',this)">Ⓒ</div>
            <div class="option" onclick="selectOption(${i},'D',this)">Ⓓ</div>
            <div style="text-align:center;"><button class="check-btn right-btn" id="right-${i}" onclick="markManual(${i}, 'right')">✅ Right</button></div>
            <div style="text-align:center;"><button class="check-btn wrong-btn" id="wrong-${i}" onclick="markManual(${i}, 'wrong')">❌ Wrong</button></div>
            <div id="yourAns-${i}" style="text-align:center; font-weight:700;">-</div>
            <div id="correctAns-${i}" style="text-align:center; font-weight:700;">-</div>
        `;
        omr.appendChild(row);

        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.innerText = i;
        btn.setAttribute("data-q", i);
        btn.onclick = () => document.getElementById("row-" + i).scrollIntoView({ behavior: "smooth" });
        nav.appendChild(btn);
    }
}

function startTestTimer() {
    if (testStarted) return;
    testStarted = true;
    document.getElementById("startTimerBtn").style.display = "none";
    timerInterval = setInterval(() => {
        seconds++;
        const min = String(Math.floor(seconds / 60)).padStart(2, "0");
        const sec = String(seconds % 60).padStart(2, "0");
        document.getElementById("timer").innerText = `${min}:${sec}`;
    }, 1000);
}

function selectOption(qNo, value, element) {
    if (!testStarted) { alert("Pehle 'Start Test Timer' button par click karein!"); return; }
    if (submitted) return;

    const row = document.getElementById("row-" + qNo);
    row.querySelectorAll(".option").forEach(opt => opt.classList.remove("selected"));
    element.classList.add("selected");
    answers[qNo] = value;
    document.getElementById("yourAns-" + qNo).innerText = value;

    const navBtn = document.querySelector(`[data-q="${qNo}"]`);
    if (navBtn) navBtn.classList.add("done");
    updateResult();
}

function submitTest() {
    if (!testStarted) { alert("Test start nahi hua!"); return; }
    submitted = true;
    clearInterval(timerInterval);
    document.getElementById("pdfArea").style.display = "block";
    document.getElementById("submitBtn").style.display = "none";

    if (autoCheckMode) {
        rightCount = 0; wrongCount = 0;
        for (let i = 1; i <= totalQuestions; i++) {
            const row = document.getElementById("row-" + i);
            const userAns = answers[i];
            const correctAns = answerKey[i];

            document.getElementById("correctAns-" + i).innerText = correctAns || "-";
            if (userAns && correctAns) {
                if (userAns === correctAns) {
                    row.classList.add("correct-row"); rightCount++;
                    updateNav(i, "right");
                } else {
                    row.classList.add("wrong-row"); wrongCount++;
                    updateNav(i, "wrong");
                }
            }
        }
        updateResult();
    } else {
        for (let i = 1; i <= totalQuestions; i++) {
            document.getElementById("right-" + i).style.display = "inline-block";
            document.getElementById("wrong-" + i).style.display = "inline-block";
        }
    }
}

function markManual(qNo, status) {
    if (!answers[qNo]) { alert("Pehle option select karein!"); return; }
    const row = document.getElementById("row-" + qNo);
    if (checkedQuestions[qNo] === status) return;
    if (checkedQuestions[qNo] === "right") rightCount--;
    if (checkedQuestions[qNo] === "wrong") wrongCount--;

    checkedQuestions[qNo] = status;
    if (status === "right") { rightCount++; row.className = "omr-row correct-row"; updateNav(qNo, "right"); }
    else { wrongCount++; row.className = "omr-row wrong-row"; updateNav(qNo, "wrong"); }
    updateResult();
}

function updateNav(qNo, status) {
    const navBtn = document.querySelector(`[data-q="${qNo}"]`);
    if (navBtn) {
        navBtn.classList.remove("checked-right", "checked-wrong");
        navBtn.classList.add(status === "right" ? "checked-right" : "checked-wrong");
    }
}

function updateResult() {
    document.getElementById("totalQuestions").innerText = totalQuestions;
    document.getElementById("attemptedQuestions").innerText = Object.keys(answers).length;
    document.getElementById("rightQuestions").innerText = rightCount;
    document.getElementById("wrongQuestions").innerText = wrongCount;
    let acc = (rightCount + wrongCount) > 0 ? ((rightCount / (rightCount + wrongCount)) * 100).toFixed(1) : 0;
    document.getElementById("accuracyPercent").innerText = acc + "%";
}

function downloadOMRPDF() {
    const element = document.getElementById("omrExportSheet");
    html2pdf().from(element).save("OMR_Report.pdf");
}
</script>
</body>
</html>
