<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Student55 Ultra AI OMR V8 - Fast Engine</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.js"></script>
<link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/cropperjs/1.5.13/cropper.min.css"/>
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>

<style>
* { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Poppins', sans-serif; }
:root { --theme: #2563eb; --bg: #f5f7fb; --card: #ffffff; --text: #111827; --border: #d1d5db; }
body { background: var(--bg); color: var(--text); transition: 0.3s; }
.dark { --bg: #111827; --card: #1f2937; --text: #ffffff; --border: #374151; }
.container { width: 95%; max-width: 1600px; margin: auto; padding: 20px; }

#welcomePage {
    min-height: 100vh;
    background: linear-gradient(135deg, #2563eb, #7c3aed, #ec4899);
    display: flex; justify-content: center; align-items: center; padding: 20px;
}
.welcome-box {
    max-width: 1000px; width: 100%; background: rgba(255, 255, 255, 0.12);
    backdrop-filter: blur(15px); padding: 40px; border-radius: 30px; text-align: center; color: white;
}
.welcome-box h1 { font-size: clamp(32px, 8vw, 55px); margin-bottom: 15px; }
.selector-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(250px, 1fr)); gap: 20px; margin-top: 25px; }
.selector-grid select { width: 100%; padding: 12px; border: none; border-radius: 12px; font-size: 15px; color: #111827; }
.start-btn { margin-top: 30px; padding: 15px 40px; font-size: 18px; font-weight: 700; border: none; border-radius: 50px; cursor: pointer; background: white; color: #2563eb; }

.upload-hero-container { margin-top: 25px; padding: 20px; background: rgba(255, 255, 255, 0.15); border-radius: 24px; text-align: center; }
.upload-btn-group { display: flex; gap: 15px; justify-content: center; flex-wrap: wrap; }
.action-upload-btn {
    flex: 1; min-width: 220px; background: #16a34a; color: #ffffff; padding: 18px;
    border-radius: 18px; cursor: pointer; font-weight: 700; font-size: 18px; border: none;
}
.action-upload-btn.gallery-btn { background: #0284c7; }
#uploadStatusBadge { display: none; background: #22c55e; color: white; padding: 14px; border-radius: 12px; margin-top: 15px; font-weight: 700; }
#cropWrapper { display: none; margin-top: 15px; background: rgba(0,0,0,0.6); padding: 15px; border-radius: 15px; }
.img-container { max-width: 100%; max-height: 450px; margin: auto; }
#cropImage { max-width: 100%; }

#app { display: none; }
.header { background: var(--card); padding: 20px; border-radius: 20px; margin-bottom: 20px; border: 1px solid var(--border); }
.header-top { display: flex; justify-content: space-between; align-items: center; flex-wrap: wrap; gap: 10px; }
.logo { font-size: 28px; font-weight: 700; color: var(--theme); }
.controls { display: flex; gap: 10px; flex-wrap: wrap; }
.btn { background: var(--theme); color: white; padding: 10px 15px; border: none; border-radius: 10px; cursor: pointer; font-weight: 600; }
.timer { background: #111827; color: white; padding: 10px 15px; border-radius: 10px; font-weight: 700; }

.result-panel { display: none; background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); margin-bottom: 20px; }
.result-grid { display: grid; grid-template-columns: repeat(auto-fit, minmax(150px, 1fr)); gap: 15px; }
.result-box { background: #eef2ff; color: #111827; padding: 15px; border-radius: 15px; text-align: center; }

.navigator { display: flex; flex-wrap: wrap; gap: 8px; margin-bottom: 20px; }
.nav-btn { width: 48px; height: 48px; border: none; border-radius: 50%; background: #e5e7eb; color: #111827; font-size: 18px; font-weight: 700; cursor: pointer; }
.nav-btn.done { background: var(--theme); color: #fff; }
.nav-btn.checked-right { background: #16a34a !important; color: white !important; }
.nav-btn.checked-wrong { background: #dc2626 !important; color: white !important; }

.omr-sheet { background: var(--card); padding: 20px; border-radius: 20px; border: 1px solid var(--border); overflow-x: auto; }
.omr-header, .omr-row { display: grid; grid-template-columns: 80px repeat(4, 70px) 110px 110px 110px 110px; align-items: center; padding: 12px; min-width: 850px; }
.omr-header { font-weight: 700; border-bottom: 2px solid var(--border); margin-bottom: 10px; }
.omr-row { border-bottom: 1px solid var(--border); }
.qno { font-weight: 600; }

.option { width: 45px; height: 45px; border: 3px solid #b8bec8; border-radius: 50%; display: flex; align-items: center; justify-content: center; font-size: 18px; font-weight: 700; cursor: pointer; margin: auto; }
.option.selected { background: var(--theme); color: white; border-color: var(--theme); }
.correct-row { background: rgba(22, 163, 74, 0.15) !important; }
.wrong-row { background: rgba(220, 38, 38, 0.15) !important; }

.check-btn { display: none; padding: 8px 12px; border: none; border-radius: 8px; cursor: pointer; color: white; font-weight: 600; }
.right-btn { background: #16a34a; }
.wrong-btn { background: #dc2626; }

#loadingOverlay {
    display: none; position: fixed; top: 0; left: 0; right: 0; bottom: 0;
    background: rgba(0,0,0,0.85); z-index: 9999; color: white;
    flex-direction: column; align-items: center; justify-content: center;
}
.spinner {
    width: 50px; height: 50px; border: 5px solid #f3f3f3; border-top: 5px solid #2563eb;
    border-radius: 50%; animation: spin 0.6s linear infinite; margin-bottom: 15px;
}
@keyframes spin { 0% { transform: rotate(0deg); } 100% { transform: rotate(360deg); } }
</style>
</head>

<body>

<div id="loadingOverlay">
    <div class="spinner"></div>
    <h3 id="loadingText">1-Second Fast OCR Scan...</h3>
</div>

<section id="welcomePage">
    <div class="welcome-box">
        <h1>🎯 Student55 Ultra Fast AI OMR</h1>
        <p>Real-time High-Speed OCR Recognition</p>

        <div class="selector-grid">
            <div>
                <label style="display:block; margin-bottom:5px; font-weight:600;">Manual Questions Select</label>
                <select id="questionCount">
                    <option value="10">10 Questions</option>
                    <option value="14">14 Questions</option>
                    <option value="20" selected>20 Questions</option>
                    <option value="30">30 Questions</option>
                    <option value="50">50 Questions</option>
                    <option value="100">100 Questions</option>
                </select>
            </div>
            <div>
                <label style="display:block; margin-bottom:5px; font-weight:600;">Theme Color</label>
                <select id="themeColor">
                    <option value="#2563eb">Blue</option>
                    <option value="#16a34a">Green</option>
                    <option value="#7c3aed">Purple</option>
                </select>
            </div>
        </div>

        <div class="upload-hero-container">
            <div class="upload-btn-group">
                <button type="button" class="action-upload-btn" onclick="document.getElementById('cameraInput').click()">📷 TAKE CAMERA PHOTO</button>
                <button type="button" class="action-upload-btn gallery-btn" onclick="document.getElementById('galleryInput').click()">🖼️ UPLOAD FROM GALLERY</button>
            </div>

            <input type="file" id="cameraInput" accept="image/*" capture="environment" style="display:none;" onchange="handleImageSelect(event)">
            <input type="file" id="galleryInput" accept="image/*" style="display:none;" onchange="handleImageSelect(event)">

            <div id="uploadStatusBadge">✅ Image Selected! Crop Answer Key area below.</div>
            
            <div id="cropWrapper">
                <div class="img-container">
                    <img id="cropImage" src="">
                </div>
                <button class="btn" style="width:100%; margin-top:15px; background:#2563eb; font-size:18px; padding:15px; border-radius:12px;" onclick="processCropAndReadFast()">⚡ SCAN NOW (1-2 SECONDS)</button>
            </div>
        </div>

        <button class="start-btn" onclick="startApp()">Start Test</button>
    </div>
</section>

<div id="app">
    <div class="container">
        <div class="header">
            <div class="header-top">
                <div class="logo">Student55 Fast AI OMR</div>
                <div class="controls">
                    <button class="btn" onclick="goHome()">🏠 Home</button>
                    <button class="btn" onclick="toggleDarkMode()">🌙 Dark Mode</button>
                    <div class="timer" id="timer">00:00</div>
                </div>
            </div>
        </div>

        <div id="pdfExportArea">
            <div id="resultPanel" class="result-panel">
                <h2 style="margin-bottom:15px;">📊 Live Result</h2>
                <div class="result-grid">
                    <div class="result-box"><h3>Total</h3><h1 id="totalQuestions">0</h1></div>
                    <div class="result-box"><h3>Attempted</h3><h1 id="attemptedQuestions">0</h1></div>
                    <div class="result-box"><h3>Right</h3><h1 id="rightQuestions">0</h1></div>
                    <div class="result-box"><h3>Wrong</h3><h1 id="wrongQuestions">0</h1></div>
                    <div class="result-box"><h3>Accuracy</h3><h1 id="accuracyPercent">0%</h1></div>
                </div>
            </div>

            <div class="omr-sheet">
                <div style="text-align:center; margin-bottom:15px;">
                    <button class="btn" id="startTimerBtn" onclick="startTestTimer()">▶ Start Test</button>
                </div>

                <div class="omr-header">
                    <div>Q.No</div>
                    <div style="text-align:center;">Ⓐ</div>
                    <div style="text-align:center;">Ⓑ</div>
                    <div style="text-align:center;">Ⓒ</div>
                    <div style="text-align:center;">Ⓓ</div>
                    <div style="text-align:center;">Right</div>
                    <div style="text-align:center;">Wrong</div>
                    <div style="text-align:center;">Your Ans</div>
                    <div style="text-align:center;">Correct Ans</div>
                </div>

                <div id="omrContainer"></div>
            </div>
        </div>

        <div id="navigator" class="navigator" style="margin-top:20px;"></div>

        <div style="text-align:center; margin-top:20px;">
            <button id="submitBtn" class="btn" onclick="submitTest()" style="padding:15px 40px; font-size:18px;">Submit Test</button>
        </div>

        <div id="pdfArea" style="display:none; text-align:center; margin-top:25px;">
            <input type="text" id="watermarkName" placeholder="Enter Name/Watermark" style="padding:10px; border-radius:8px; border:1px solid #ccc; margin-right:10px;">
            <button class="btn" onclick="downloadOMRPDF()">📄 Download Report PDF</button>
        </div>

        <div style="text-align:center; margin-top:15px;">
            <button class="btn" onclick="goHome()">🔄 Restart Test</button>
        </div>
    </div>
</div>

<script>
let totalQuestions = 20;
let userAnswers = {};
let extractedAnswerKey = {};
let autoCheckMode = false;
let testStarted = false;
let submitted = false;
let rightCount = 0, wrongCount = 0, seconds = 0, timerInterval = null;
let checkedQuestions = {};
let cropper = null;
let tesseractWorker = null;

// Worker Pre-initialization for instant execution
async function initWorker() {
    if (!tesseractWorker) {
        tesseractWorker = await Tesseract.createWorker('eng');
        await tesseractWorker.setParameters({
            tessedit_pageseg_mode: Tesseract.PSM.SINGLE_BLOCK,
            tessedit_char_whitelist: '0123456789ABCDabcd.:-)\n '
        });
    }
}
initWorker();

function handleImageSelect(e) {
    const file = e.target.files[0];
    if (file) {
        document.getElementById('uploadStatusBadge').style.display = 'block';
        const reader = new FileReader();
        reader.onload = function(event) {
            const cropImg = document.getElementById('cropImage');
            cropImg.src = event.target.result;
            document.getElementById('cropWrapper').style.display = 'block';
            if (cropper) cropper.destroy();
            cropper = new Cropper(cropImg, { aspectRatio: NaN, viewMode: 1 });
        };
        reader.readAsDataURL(file);
    }
}

// Ultra Fast Single-Pass Processing Buffer
function generateFastOptimizedCanvas(sourceCanvas) {
    const canvas = document.createElement('canvas');
    // Optimal fixed width for maximum speed + high OCR contrast
    const targetWidth = 800; 
    const scaleRatio = targetWidth / sourceCanvas.width;
    canvas.width = targetWidth;
    canvas.height = sourceCanvas.height * scaleRatio;

    const ctx = canvas.getContext('2d', { alpha: false });
    ctx.imageSmoothingEnabled = true;
    ctx.drawImage(sourceCanvas, 0, 0, canvas.width, canvas.height);

    const imgData = ctx.getImageData(0, 0, canvas.width, canvas.height);
    const data = imgData.data;

    // High Speed Binarization Filter
    for (let i = 0; i < data.length; i += 4) {
        let v = (data[i] * 0.299 + data[i + 1] * 0.587 + data[i + 2] * 0.114);
        v = v < 128 ? 0 : 255;
        data[i] = data[i + 1] = data[i + 2] = v;
    }

    ctx.putImageData(imgData, 0, 0);
    return canvas;
}

// High Speed OCR Reader (1-2 Seconds Execution)
async function processCropAndReadFast() {
    if (!cropper) return;
    
    document.getElementById("loadingOverlay").style.display = "flex";
    const startTime = performance.now();

    try {
        const rawCanvas = cropper.getCroppedCanvas();
        const fastCanvas = generateFastOptimizedCanvas(rawCanvas);

        await initWorker();
        const { data: { text } } = await tesseractWorker.recognize(fastCanvas);

        extractedAnswerKey = {};

        // Fast Regex Mapping Pipeline
        const cleanText = text.replace(/O|o/g, '0').replace(/I|l|\|/g, '1').replace(/S|s/g, '5').replace(/B/g, '8');
        const lines = cleanText.split('\n');

        lines.forEach(line => {
            const matches = [...line.matchAll(/(\d{1,3})\s*[\.\-:\)\s]*\s*([A-D])/gi)];
            matches.forEach(match => {
                const qNum = parseInt(match[1]);
                const qAns = match[2].toUpperCase();
                if (qNum > 0 && qNum <= 200) {
                    if (!extractedAnswerKey[qNum]) {
                        extractedAnswerKey[qNum] = qAns;
                    }
                }
            });
        });

        // Sequence Healing: Missing Keys Correction Logic
        const keys = Object.keys(extractedAnswerKey).map(Number).sort((a,b)=>a-b);
        if (keys.length > 0) {
            const maxKey = Math.max(...keys);
            for (let i = 1; i <= maxKey; i++) {
                if (!extractedAnswerKey[i]) {
                    // Quick check pattern heuristic
                    const lineText = lines.find(l => l.includes(`${i}`));
                    if (lineText) {
                        const m = lineText.match(/[A-D]/i);
                        if (m) extractedAnswerKey[i] = m[0].toUpperCase();
                    }
                }
            }
        }

        document.getElementById("loadingOverlay").style.display = "none";
        const totalDetected = Object.keys(extractedAnswerKey).length;
        const endTime = performance.now();

        if (totalDetected > 0) {
            autoCheckMode = true;
            totalQuestions = Math.max(...Object.keys(extractedAnswerKey).map(Number));
            alert(`⚡ Scan Completed in ${((endTime - startTime)/1000).toFixed(2)} seconds!\n\nDetected Answers: ${totalDetected} / ${totalQuestions}\n\nClick 'Start Test' to continue.`);
        } else {
            alert("⚠️ Clear cropped area select karein.");
        }
    } catch (err) {
        console.error(err);
        document.getElementById("loadingOverlay").style.display = "none";
        alert("Scan Error! Please try again.");
    }
}

function startApp() {
    if (!autoCheckMode) {
        totalQuestions = parseInt(document.getElementById("questionCount").value);
    }
    const theme = document.getElementById("themeColor").value;
    document.documentElement.style.setProperty("--theme", theme);
    document.getElementById("welcomePage").style.display = "none";
    document.getElementById("app").style.display = "block";
    generateOMR();
    updateResult();
    document.getElementById("resultPanel").style.display = "block";
}

function generateOMR() {
    const omr = document.getElementById("omrContainer");
    const nav = document.getElementById("navigator");
    omr.innerHTML = ""; nav.innerHTML = "";

    for (let i = 1; i <= totalQuestions; i++) {
        const row = document.createElement("div");
        row.className = "omr-row";
        row.id = "row-" + i;
        row.innerHTML = `
            <div class="qno">${String(i).padStart(2, "0")}</div>
            <div class="option" data-opt="A" onclick="selectOption(${i},'A',this)">Ⓐ</div>
            <div class="option" data-opt="B" onclick="selectOption(${i},'B',this)">Ⓑ</div>
            <div class="option" data-opt="C" onclick="selectOption(${i},'C',this)">Ⓒ</div>
            <div class="option" data-opt="D" onclick="selectOption(${i},'D',this)">Ⓓ</div>
            <div style="text-align:center;"><button class="check-btn right-btn" id="right-${i}" onclick="markManual(${i}, 'right')">✅ Right</button></div>
            <div style="text-align:center;"><button class="check-btn wrong-btn" id="wrong-${i}" onclick="markManual(${i}, 'wrong')">❌ Wrong</button></div>
            <div id="yourAns-${i}" style="text-align:center; font-weight:700;">-</div>
            <div id="correctAns-${i}" style="text-align:center; font-weight:700;">-</div>
        `;
        omr.appendChild(row);

        const btn = document.createElement("button");
        btn.className = "nav-btn";
        btn.innerText = i;
        btn.setAttribute("data-q", i);
        btn.onclick = () => document.getElementById("row-" + i).scrollIntoView({ behavior: "smooth" });
        nav.appendChild(btn);
    }
}

function startTestTimer() {
    if (testStarted) return;
    testStarted = true;
    document.getElementById("startTimerBtn").style.display = "none";
    timerInterval = setInterval(() => {
        seconds++;
        const min = String(Math.floor(seconds / 60)).padStart(2, "0");
        const sec = String(seconds % 60).padStart(2, "0");
        document.getElementById("timer").innerText = `${min}:${sec}`;
    }, 1000);
}

function selectOption(qNo, value, element) {
    if (!testStarted) { alert("Pehle '▶ Start Test' par click karein!"); return; }
    if (submitted) return;
    const row = document.getElementById("row-" + qNo);
    row.querySelectorAll(".option").forEach(opt => opt.classList.remove("selected"));
    element.classList.add("selected");
    userAnswers[qNo] = value;
    document.getElementById("yourAns-" + qNo).innerText = value;
    const navBtn = document.querySelector(`[data-q="${qNo}"]`);
    if (navBtn) navBtn.classList.add("done");
    updateResult();
}

function submitTest() {
    if (!testStarted) { alert("Test start nahi hua h!"); return; }
    submitted = true;
    clearInterval(timerInterval);
    document.getElementById("pdfArea").style.display = "block";
    document.getElementById("submitBtn").style.display = "none";

    if (autoCheckMode) {
        rightCount = 0; wrongCount = 0;
        for (let i = 1; i <= totalQuestions; i++) {
            const row = document.getElementById("row-" + i);
            const myAns = userAnswers[i] || "-";
            const picAns = extractedAnswerKey[i] || "-";
            document.getElementById("yourAns-" + i).innerText = myAns;
            document.getElementById("correctAns-" + i).innerText = picAns;

            if (userAnswers[i] && extractedAnswerKey[i]) {
                if (userAnswers[i] === extractedAnswerKey[i]) {
                    row.classList.add("correct-row");
                    rightCount++;
                    updateNav(i, "right");
                } else {
                    row.classList.add("wrong-row");
                    wrongCount++;
                    updateNav(i, "wrong");
                }
            } else if (!userAnswers[i] && extractedAnswerKey[i]) {
                row.classList.add("wrong-row");
            }
        }
        updateResult();
    } else {
        for (let i = 1; i <= totalQuestions; i++) {
            document.getElementById("right-" + i).style.display = "inline-block";
            document.getElementById("wrong-" + i).style.display = "inline-block";
        }
    }
}

function markManual(qNo, status) {
    if (!userAnswers[qNo]) return;
    const row = document.getElementById("row-" + qNo);
    if (checkedQuestions[qNo] === status) return;
    if (checkedQuestions[qNo] === "right") rightCount--;
    if (checkedQuestions[qNo] === "wrong") wrongCount--;
    checkedQuestions[qNo] = status;

    if (status === "right") {
        rightCount++;
        row.className = "omr-row correct-row";
        updateNav(qNo, "right");
    } else {
        wrongCount++;
        row.className = "omr-row wrong-row";
        updateNav(qNo, "wrong");
    }
    updateResult();
}

function updateNav(qNo, status) {
    const navBtn = document.querySelector(`[data-q="${qNo}"]`);
    if (navBtn) {
        navBtn.classList.remove("checked-right", "checked-wrong");
        if (status === "right") navBtn.classList.add("checked-right");
        if (status === "wrong") navBtn.classList.add("checked-wrong");
    }
}

function updateResult() {
    document.getElementById("totalQuestions").innerText = totalQuestions;
    document.getElementById("attemptedQuestions").innerText = Object.keys(userAnswers).length;
    document.getElementById("rightQuestions").innerText = rightCount;
    document.getElementById("wrongQuestions").innerText = wrongCount;
    let acc = (rightCount + wrongCount) > 0 ? ((rightCount / (rightCount + wrongCount)) * 100).toFixed(1) : 0;
    document.getElementById("accuracyPercent").innerText = acc + "%";
}

function toggleDarkMode() { document.body.classList.toggle("dark"); }
function goHome() { location.reload(); }

function downloadOMRPDF() {
    const name = document.getElementById("watermarkName").value || "Student55";
    const element = document.getElementById("pdfExportArea");
    html2pdf().set({
        margin: [0.3, 0.3, 0.3, 0.3],
        filename: `OMR_Report_${name}.pdf`,
        image: { type: 'jpeg', quality: 0.98 },
        html2canvas: { scale: 2 },
        jsPDF: { unit: 'in', format: 'a4', orientation: 'portrait' }
    }).from(element).save();
}
</script>
</body>
</html>
