<!DOCTYPE html>
<html lang="en">
<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">

<title>Student55 Advanced OMR V2</title>

<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

<link rel="stylesheet"
href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">

<style>

*{
margin:0;
padding:0;
box-sizing:border-box;
font-family:'Poppins',sans-serif;
}

:root{
--primary:#2563eb;
--secondary:#7c3aed;
--bg:#f5f7fb;
--card:#ffffff;
--text:#111827;
}

body{
background:var(--bg);
color:var(--text);
transition:.3s;
}

.dark{
--bg:#111827;
--card:#1f2937;
--text:#ffffff;
}

.container{
width:95%;
max-width:1400px;
margin:auto;
padding:20px;
}

/* =========================
WELCOME PAGE
========================= */

#welcomePage{

min-height:100vh;

background:
linear-gradient(
135deg,
#2563eb,
#7c3aed,
#ec4899
);

display:flex;
justify-content:center;
align-items:center;
padding:30px;
}

.welcome-box{

max-width:900px;
width:100%;

background:rgba(255,255,255,.12);

backdrop-filter:blur(20px);

border-radius:30px;

padding:50px;

text-align:center;

color:white;

box-shadow:
0 20px 50px rgba(0,0,0,.25);
}

.welcome-box h1{
font-size:55px;
margin-bottom:15px;
}

.welcome-box p{
font-size:18px;
line-height:1.8;
margin-bottom:25px;
}

.start-btn{

padding:15px 40px;

font-size:18px;

font-weight:700;

border:none;

border-radius:50px;

cursor:pointer;

background:white;

color:#2563eb;
}

.feature-grid{

margin-top:40px;

display:grid;

grid-template-columns:
repeat(auto-fit,minmax(200px,1fr));

gap:20px;
}

.feature-card{

background:rgba(255,255,255,.15);

padding:20px;

border-radius:20px;
}

.feature-card i{
font-size:30px;
margin-bottom:10px;
}

.feature-card h3{
margin-bottom:10px;
}

/* =========================
MAIN APP
========================= */

#app{
display:none;
}

.header{

background:var(--card);

padding:20px;

border-radius:20px;

margin-bottom:20px;

box-shadow:
0 5px 15px rgba(0,0,0,.1);
}

.header-top{

display:flex;

justify-content:space-between;

align-items:center;

flex-wrap:wrap;

gap:10px;
}

.logo{
font-size:28px;
font-weight:700;
}

.controls{
display:flex;
gap:10px;
flex-wrap:wrap;
}

button,
select{

padding:10px 15px;

border:none;

border-radius:10px;

cursor:pointer;

font-weight:600;
}

.primary{
background:var(--primary);
color:white;
}

.timer{
background:#111827;
color:white;
font-weight:700;
}

.dark .timer{
background:#000;
}

/* next parts continue */

</style>
</head>

<body>

<!-- WELCOME PAGE -->

<section id="welcomePage">

<div class="welcome-box">

<h1>🎯 Welcome To Student55 Advanced OMR V2</h1>

<p>

Practice, Check, Analyse and Export
your OMR tests with advanced features.

</p>

<button class="start-btn"
onclick="startApp()">

Start Test

</button>

<div class="feature-grid">

<div class="feature-card">
<i class="fas fa-file-pdf"></i>
<h3>PDF Export</h3>
</div>

<div class="feature-card">
<i class="fas fa-chart-line"></i>
<h3>Analytics</h3>
</div>

<div class="feature-card">
<i class="fas fa-star"></i>
<h3>Rating System</h3>
</div>

<div class="feature-card">
<i class="fab fa-instagram"></i>
<h3>Instagram</h3>
</div>

</div>

</div>

</section>

<!-- MAIN APP -->

<div id="app">

<div class="container">

<div class="header">

<div class="header-top">

<div class="logo">

Student55 Advanced OMR V2

</div>

<div class="controls">

<select id="themeSelector">

<option value="blue">Blue</option>
<option value="green">Green</option>
<option value="purple">Purple</option>
<option value="red">Red</option>

</select>

<button
class="primary"
onclick="toggleDarkMode()">

Dark Mode

</button>

<div class="timer"
id="timer">

00:00

</div>

</div>

</div>

</div>
<!-- RESULT PANEL -->

<div id="resultPanel" class="result-panel">

<h2 style="margin-bottom:15px;">
📊 Test Analysis
</h2>

<div class="result-grid">

<div class="result-card">
<h3>Total</h3>
<h1 id="totalQuestions">0</h1>
</div>

<div class="result-card">
<h3>Attempted</h3>
<h1 id="attemptedQuestions">0</h1>
</div>

<div class="result-card">
<h3>Right</h3>
<h1 id="rightQuestions">0</h1>
</div>

<div class="result-card">
<h3>Wrong</h3>
<h1 id="wrongQuestions">0</h1>
</div>

<div class="result-card">
<h3>Accuracy</h3>
<h1 id="accuracyPercent">0%</h1>
</div>

</div>

</div>


<!-- QUESTION NAVIGATOR -->

<div id="navigator" class="navigator">

</div>


<!-- QUESTIONS AREA -->

<div id="questionsContainer">

</div>


<!-- SUBMIT BUTTON -->

<div style="text-align:center;margin-top:25px;">

<button
id="submitBtn"
class="primary"
style="
padding:15px 40px;
font-size:18px;
">

Submit Test

</button>

</div>


<!-- PDF BUTTON -->

<div
id="pdfArea"
style="
display:none;
text-align:center;
margin-top:15px;
">

<button
class="primary"
onclick="downloadPDF()">

📄 Download PDF

</button>

</div>


<!-- RESTART BUTTON -->

<div
style="
text-align:center;
margin-top:15px;
">

<button
onclick="restartTest()">

🔄 Restart Test

</button>

</div>


<script>

/* ==========================
QUESTIONS DATA
========================== */

const questions = [

{
q:"Question 1",
options:["A","B","C","D"]
},

{
q:"Question 2",
options:["A","B","C","D"]
},

{
q:"Question 3",
options:["A","B","C","D"]
},

{
q:"Question 4",
options:["A","B","C","D"]
},

{
q:"Question 5",
options:["A","B","C","D"]
}

];


/* ==========================
STATE VARIABLES
========================== */

let answers = {};

let submitted = false;

let rightCount = 0;

let wrongCount = 0;


/* ==========================
LOAD QUESTIONS
========================== */

function loadQuestions(){

const container =
document.getElementById(
"questionsContainer"
);

container.innerHTML = "";

questions.forEach((question,index)=>{

const card =
document.createElement("div");

card.className =
"question-card";

card.id =
"question-"+index;

card.innerHTML = `

<div class="question-title">

${index+1}. ${question.q}

</div>

<div class="options">

${question.options.map((opt,optIndex)=>

`

<div
class="option"
onclick="selectOption(${index},${optIndex},this)">

${opt}

</div>

`

).join("")}

</div>


<div
class="checking-panel"
id="check-${index}"
style="display:none;margin-top:15px;">

<button
class="right-btn"
onclick="markRight(${index})">

✅ Right

</button>

<button
class="wrong-btn"
onclick="markWrong(${index})">

❌ Wrong

</button>

</div>

`;

container.appendChild(card);

});

createNavigator();

updateTotals();

}


/* ==========================
NAVIGATOR
========================== */

function createNavigator(){

const nav =
document.getElementById(
"navigator"
);

nav.innerHTML = "";

questions.forEach((q,index)=>{

const btn =
document.createElement("button");

btn.className =
"nav-btn";

btn.innerText =
index+1;

btn.onclick = ()=>{

document
.getElementById(
"question-"+index
)
.scrollIntoView({
behavior:"smooth"
});

};

nav.appendChild(btn);

});

}


/* ==========================
OPTION SELECT
========================== */

function selectOption(
qIndex,
optionIndex,
element
){

if(submitted) return;

const parent =
element.parentElement;

parent
.querySelectorAll(".option")
.forEach(opt=>{

opt.classList.remove(
"selected"
);

});

element.classList.add(
"selected"
);

answers[qIndex] =
optionIndex;

updateTotals();

}


/* ==========================
UPDATE ATTEMPTED
========================== */

function updateTotals(){

document
.getElementById(
"totalQuestions"
)
innerText =
questions.length;

document
.getElementById(
"attemptedQuestions"
)
innerText =
Object.keys(
answers
).length;

}


/* ==========================
SUBMIT TEST
========================== */

document
.getElementById(
"submitBtn"
)
.addEventListener(
"click",
()=>{

submitted = true;

document
.getElementById(
"resultPanel"
)
.style.display =
"block";

document
.getElementById(
"pdfArea"
)
.style.display =
"block";

questions.forEach((q,index)=>{

document
.getElementById(
"check-"+index
)
.style.display =
"flex";

});

alert(
"Checking Mode Enabled"
);

}
);
    
/* ==========================
MARK RIGHT
========================== */

function markRight(index){

const card =
document.getElementById(
"question-"+index
);

if(
card.classList.contains("correct-row") ||
card.classList.contains("wrong-row")
){
return;
}

card.classList.add(
"correct-row"
);

rightCount++;

updateResult();

highlightSelected(
index,
true
);

}


/* ==========================
MARK WRONG
========================== */

function markWrong(index){

const card =
document.getElementById(
"question-"+index
);

if(
card.classList.contains("correct-row") ||
card.classList.contains("wrong-row")
){
return;
}

card.classList.add(
"wrong-row"
);

wrongCount++;

updateResult();

highlightSelected(
index,
false
);

}


/* ==========================
HIGHLIGHT SELECTED OPTION
========================== */

function highlightSelected(
qIndex,
isCorrect
){

const card =
document.getElementById(
"question-"+qIndex
);

const options =
card.querySelectorAll(
".option"
);

const selected =
answers[qIndex];

if(
selected === undefined
) return;

options[selected]
.style.background =
isCorrect
? "#16a34a"
: "#dc2626";

options[selected]
.style.color =
"#fff";

options[selected]
.style.border =
"none";

}


/* ==========================
RESULT UPDATE
========================== */

function updateResult(){

document
.getElementById(
"rightQuestions"
)
.innerText =
rightCount;

document
.getElementById(
"wrongQuestions"
)
.innerText =
wrongCount;

let attempted =
Object.keys(
answers
).length;

let accuracy = 0;

if(
(rightCount+wrongCount)
>0
){

accuracy =
(
rightCount /
(
rightCount+
wrongCount
)
*100
).toFixed(2);

}

document
.getElementById(
"accuracyPercent"
)
.innerText =
accuracy + "%";

}


/* ==========================
RESTART TEST
========================== */

function restartTest(){

if(
!confirm(
"Restart Test?"
)
){
return;
}

answers = {};

submitted = false;

rightCount = 0;

wrongCount = 0;

document
.getElementById(
"resultPanel"
)
.style.display =
"none";

document
.getElementById(
"pdfArea"
)
.style.display =
"none";

loadQuestions();

}


/* ==========================
START APP
========================== */

function startApp(){

document
.getElementById(
"welcomePage"
)
.style.display =
"none";

document
.getElementById(
"app"
)
.style.display =
"block";

}


/* ==========================
DARK MODE
========================== */

function toggleDarkMode(){

document.body
.classList.toggle(
"dark"
);

}


/* ==========================
THEME SYSTEM
========================== */

document
.getElementById(
"themeSelector"
)
.addEventListener(
"change",
function(){

const value =
this.value;

if(
value==="blue"
){

document
.documentElement
.style
.setProperty(
"--primary",
"#2563eb"
);

}

if(
value==="green"
){

document
.documentElement
.style
.setProperty(
"--primary",
"#16a34a"
);

}

if(
value==="purple"
){

document
.documentElement
.style
.setProperty(
"--primary",
"#7c3aed"
);

}

if(
value==="red"
){

document
.documentElement
.style
.setProperty(
"--primary",
"#dc2626"
);

}

}
);


/* ==========================
TIMER
========================== */

let seconds = 0;

setInterval(()=>{

seconds++;

let mins =
Math.floor(
seconds/60
);

let sec =
seconds%60;

document
.getElementById(
"timer"
)
.innerText =

String(mins)
.padStart(2,"0")

+

":"

+

String(sec)
.padStart(2,"0");

},1000);


/* ==========================
INITIAL LOAD
========================== */

loadQuestions();
    
<!-- ==========================
CUSTOM WATERMARK
========================== -->

<div class="header" style="margin-top:25px;">

<h2>PDF Settings</h2>

<input
type="text"
id="watermarkName"
placeholder="Enter Watermark Name"
style="
width:100%;
padding:12px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
">

</div>


<!-- ==========================
INSTAGRAM
========================== -->

<div class="header">

<h2>Instagram</h2>

<p style="margin-top:10px;">
Follow us on Instagram
</p>

<a
href="https://instagram.com/"
target="_blank">

<button
class="primary"
style="margin-top:10px;">

📸 Instagram

</button>

</a>

</div>


<!-- ==========================
RATING SYSTEM
========================== -->

<div class="header">

<h2>Rate This Website</h2>

<div
id="ratingStars"
style="
font-size:35px;
margin-top:15px;
cursor:pointer;
">

<span onclick="rateSite(1)">⭐</span>
<span onclick="rateSite(2)">⭐</span>
<span onclick="rateSite(3)">⭐</span>
<span onclick="rateSite(4)">⭐</span>
<span onclick="rateSite(5)">⭐</span>

</div>

<h3 style="margin-top:15px;">

Average Rating:
<span id="avgRating">

0

</span>

</h3>

<h3>

Total Ratings:
<span id="totalRatings">

0

</span>

</h3>

</div>


<!-- ==========================
COMMENTS
========================== -->

<div class="header">

<h2>Public Comments</h2>

<input
id="commentName"
placeholder="Your Name"
style="
width:100%;
padding:10px;
margin-top:10px;
border-radius:10px;
border:1px solid #ccc;
">

<textarea
id="commentText"
placeholder="Write Comment"
style="
width:100%;
height:100px;
margin-top:10px;
padding:10px;
border-radius:10px;
">

</textarea>

<button
class="primary"
style="margin-top:10px;"
onclick="addComment()">

Post Comment

</button>

<div
id="commentsArea"
style="margin-top:20px;">

</div>

</div>


<!-- ==========================
HELP BOX
========================== -->

<div class="header">

<h2>Help Center</h2>

<p>
Only Admin Can View Help Messages
</p>

<textarea
id="helpMessage"
placeholder="Type Your Help Message"
style="
width:100%;
height:120px;
padding:10px;
margin-top:10px;
border-radius:10px;
">

</textarea>

<button
class="primary"
style="margin-top:10px;"
onclick="sendHelpMessage()">

Send Help Request

</button>

</div>


<!-- ==========================
FOOTER
========================== -->

<div
style="
text-align:center;
padding:30px;
font-size:15px;
">

© Student55 Advanced OMR V2

</div>

<script>

/* ==========================
PDF EXPORT
========================== */

function downloadPDF(){

const watermark =
document
.getElementById(
"watermarkName"
)
.value || "Student55";

const pdfContent =

`
Student55 Advanced OMR V2

Watermark:
${watermark}

Total:
${questions.length}

Attempted:
${Object.keys(answers).length}

Right:
${rightCount}

Wrong:
${wrongCount}

Accuracy:
${document.getElementById("accuracyPercent").innerText}

Generated:
${new Date().toLocaleString()}
`;

const blob =
new Blob(
[pdfContent],
{
type:"text/plain"
}
);

const a =
document.createElement("a");

a.href =
URL.createObjectURL(
blob
);

a.download =
"Student55_Result.pdf";

a.click();

}


/* ==========================
RATING SYSTEM
========================== */

let totalStars = 0;
let ratingUsers = 0;

function rateSite(stars){

totalStars += stars;

ratingUsers++;

document
.getElementById(
"avgRating"
)
.innerText =

(
totalStars /
ratingUsers
).toFixed(2);

document
.getElementById(
"totalRatings"
)
.innerText =
ratingUsers;

}


/* ==========================
COMMENTS
========================== */

function addComment(){

const name =
document
.getElementById(
"commentName"
)
.value;

const text =
document
.getElementById(
"commentText"
)
.value;

if(
name==="" ||
text===""
){
return;
}

const box =
document
.createElement(
"div"
);

box.style.marginBottom =
"15px";

box.style.padding =
"15px";

box.style.border =
"1px solid #ddd";

box.style.borderRadius =
"10px";

box.innerHTML =

`
<b>${name}</b>

<br><br>

${text}

<br><br>

<button onclick="this.parentElement.remove()">

Delete

</button>
`;

const area =
document
.getElementById(
"commentsArea"
);

area.prepend(box);

document
.getElementById(
"commentName"
)
.value="";

document
.getElementById(
"commentText"
)
.value="";

}


/* ==========================
HELP MESSAGE
========================== */

function sendHelpMessage(){

const msg =
document
.getElementById(
"helpMessage"
)
.value;

if(msg===""){
return;
}

alert(
"Help Request Sent"
);

document
.getElementById(
"helpMessage"
)
.value="";

}

</script>

</div>
</div>

</body>
</html>
